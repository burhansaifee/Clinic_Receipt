<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedFlow Developer Suite</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            justify-content: center;
            background: #f1f5f9;
            padding: 0.5rem;
            border-radius: 1rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            padding: 0.75rem 2rem;
            background: transparent;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tab-content {
            display: none;
            background: var(--card);
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            border: 1px solid var(--border);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title { margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 700; color: #334155; }

        .input-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea {
            width: 100%; padding: 0.8rem; border: 1.5px solid var(--border);
            border-radius: 0.75rem; font-size: 1rem; box-sizing: border-box;
            background: #f8fafc;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary); background: white;
        }

        .btn {
            width: 100%; padding: 1rem; background: var(--primary); color: white;
            border: none; border-radius: 0.75rem; font-weight: 700; cursor: pointer; 
            margin-top: 1rem; transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .btn-secondary { background: white; color: var(--text); border: 1.5px solid var(--border); margin-top: 0.5rem; }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        .doctor-list {
            margin: 1.5rem 0; border: 1px solid var(--border); border-radius: 1rem; overflow: hidden;
            background: #f8fafc;
        }

        .doctor-item {
            padding: 1rem; border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center;
        }
        .doctor-item:last-child { border-bottom: none; }
        .remove-btn { color: #ef4444; background: #fee2e2; border: none; padding: 0.4rem 0.8rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; }

        .result-box {
            margin-top: 2rem; padding: 1.5rem; background: #f0f9ff; border: 2px dashed var(--primary);
            border-radius: 1rem; display: none; text-align: center;
        }
        .key-text { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 800; color: #0369a1; margin: 1rem 0; word-break: break-all; }
        
        .footer { margin-top: 3rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>MedFlow Suite v2</h1>
            <p>Professional Developer Tools</p>
        </div>

        <div class="tabs">
            <button id="btn-license" class="tab-btn active" onclick="showTab('license')">License Keys</button>
            <button id="btn-doctors" class="tab-btn" onclick="showTab('doctors')">Doctor Setup</button>
        </div>

        <!-- License Tab -->
        <div id="license-tab" class="tab-content active">
            <h2 class="section-title">New Activation / Renewal Key</h2>
            <div class="input-group">
                <label>Customer Machine ID</label>
                <input type="text" id="machine-id" placeholder="Paste ID from customer app...">
            </div>
            <div class="input-group">
                <label>Validity Period (Subscription Duration)</label>
                <select id="validity">
                    <option value="30">1 Month (Trial)</option>
                    <option value="90">3 Months</option>
                    <option value="180">6 Months</option>
                    <option value="365" selected>1 Year (Standard)</option>
                    <option value="730">2 Years</option>
                    <option value="3650">Lifetime (10 Years)</option>
                </select>
            </div>
            <button class="btn" onclick="generateLicense()">Generate License Key</button>
            
            <div id="license-result" class="result-box">
                <label style="color: var(--primary)">YOUR CUSTOMER'S KEY:</label>
                <div class="key-text" id="license-key-display"></div>
                <button class="btn-secondary" style="width: 100%" onclick="copy('license-key-display')">Copy Key</button>
            </div>
        </div>

        <!-- Doctor Tab -->
        <div id="doctors-tab" class="tab-content">
            <h2 class="section-title">Configure Clinic Doctors</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="input-group"><label>Doctor Name</label><input type="text" id="doc-name" placeholder="Dr. John Doe"></div>
                <div class="input-group"><label>Specialization</label><input type="text" id="doc-spec" placeholder="Cardiologist"></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="input-group"><label>Qualifications</label><input type="text" id="doc-qual" placeholder="MBBS, MD"></div>
                <div class="input-group"><label>Phone Number</label><input type="text" id="doc-phone" placeholder="+91 98765 43210"></div>
            </div>
            <div class="input-group"><label>Chamber Address (For Receipt Header)</label><textarea id="doc-addr" rows="2" placeholder="Line 1, City, State..."></textarea></div>
            <button class="btn-secondary" style="width: 100%" onclick="addDoctor()">+ Add Doctor to List</button>

            <div class="doctor-list" id="doctor-list-ui">
                <!-- Doctors added here -->
            </div>

            <button class="btn" onclick="generateSyncKey()">Generate Doctor Setup Key</button>
            
            <div id="sync-result" class="result-box">
                <label style="color: var(--primary)">DOCTOR SETUP KEY:</label>
                <div class="key-text" id="sync-key-display"></div>
                <button class="btn-secondary" style="width: 100%" onclick="copy('sync-key-display')">Copy Setup Key</button>
            </div>
        </div>

        <div class="footer">
            MedFlow Clinic Management © 2024<br>
            Secure Hash Algorithm v2 (SHA-256)
        </div>
    </div>

    <script>
        const SECRET_SALT = 'MEDFLOW-OFFLINE-LICENSE-2024-X99';
        let doctorList = [];

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
        }

        async function generateLicense() {
            const mid = document.getElementById('machine-id').value.trim();
            if(!mid) return alert('Please enter a Machine ID');
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + parseInt(document.getElementById('validity').value));
            const ds = expiry.getFullYear() + String(expiry.getMonth()+1).padStart(2,'0') + String(expiry.getDate()).padStart(2,'0');
            const hash = await sha256(mid + ds + SECRET_SALT);
            const key = `${ds}-${hash.substring(0,4)}-${hash.substring(4,8)}-${hash.substring(8,12)}-${hash.substring(12,16)}`;
            document.getElementById('license-key-display').innerText = key;
            document.getElementById('license-result').style.display = 'block';
        }

        function addDoctor() {
            const n = document.getElementById('doc-name').value;
            const s = document.getElementById('doc-spec').value;
            const q = document.getElementById('doc-qual').value;
            const p = document.getElementById('doc-phone').value;
            const a = document.getElementById('doc-addr').value;
            if(!n) return alert('Doctor name is required');
            doctorList.push({ 
                id: Date.now().toString(), 
                name: n, 
                specialization: s, 
                qualifications: q, 
                phone: p, 
                address: a 
            });
            renderDoctors();
            document.getElementById('doc-name').value = '';
            document.getElementById('doc-spec').value = '';
            document.getElementById('doc-qual').value = '';
            document.getElementById('doc-phone').value = '';
            document.getElementById('doc-addr').value = '';
        }

        function renderDoctors() {
            const ui = document.getElementById('doctor-list-ui');
            if(doctorList.length === 0) {
                ui.innerHTML = '<div style="padding: 1.5rem; text-align: center; color: #94a3b8">No doctors added. Add them using the form above.</div>';
                return;
            }
            ui.innerHTML = doctorList.map((d, i) => `
                <div class="doctor-item">
                    <span>
                        <strong>${d.name}</strong> (${d.specialization}) <br>
                        <small style="color:#64748b">${d.phone || 'No phone'} | ${d.address || 'No address'}</small>
                    </span>
                    <button class="remove-btn" onclick="doctorList.splice(${i},1);renderDoctors()">Remove</button>
                </div>
            `).join('');
        }
        renderDoctors();

        function generateSyncKey() {
            if(doctorList.length === 0) return alert('Please add at least one doctor to generate a key');
            const key = btoa(JSON.stringify(doctorList));
            document.getElementById('sync-key-display').innerText = key;
            document.getElementById('sync-result').style.display = 'block';
        }

        function copy(id) {
            const text = document.getElementById(id).innerText;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>
</html>
